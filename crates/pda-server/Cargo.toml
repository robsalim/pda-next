[package]
name = "pda-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP+WebSocket сервер PDA: REST поверх ядра pda-core и статика unified-фронтенда"

[[bin]]
name = "pda-server"
path = "src/main.rs"

[dependencies]
pda-core = { path = "../pda-core" }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
printpdf = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }
tempfile = "3"
tokio-modbus = { version = "0.11", default-features = false, features = ["tcp"] }
# Для регресс-теста PDF-экспорта: читаем содержимое сгенерированного файла.
lopdf = { version = "0.44", default-features = false }


